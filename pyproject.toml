[project]
name = "pipelines-dagster"
version = "0.1.0"
description = "Dagster pipelines"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
