# Asset this pipeline produces (no dots allowed in keys)
asset_key: ["s3", "warehouse", "exports", "test_trino_s3"]

# Dependencies (asset keys this depends on)
depends_on:
  - ["lakehouse", "test", "test_trino_insert_select"]

# Pipeline steps
steps:
  # Step 1: Extract from Trino that returns dataframes
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: "SELECT * FROM lakehouse.test.test_a"

  # Step 2: Load into S3
  - name: load
    executor: dataframe_to_s3
    inputs: ["df"]
    depends_on: ["extract"]
    config:
      s3_endpoint: http://minio-ec2bcee8.trino.svc.cluster.local:9000
      s3_bucket: warehouse
      s3_key: exports/test_trino_s3.csv
      s3_access_key: admin
      # s3_secret_key is provided via environment variable S3_SECRET_KEY
