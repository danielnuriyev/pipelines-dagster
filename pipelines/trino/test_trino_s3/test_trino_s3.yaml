# Asset this pipeline produces (no dots allowed in keys)
asset_key: ["s3", "{{ minio.bucket }}", "exports", "test_trino_s3"]

# Dependencies (asset keys this depends on)
depends_on:
  - ["{{ trino.catalog }}", "{{ trino.schema }}", "test_trino_insert_select"]

# Pipeline steps
steps:
  # Step 1: Extract from Trino that returns dataframes
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: "SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.test_trino_insert_select"

  # Step 2: Load into S3
  - name: dataframe_to_s3
    executor: dataframe_to_s3
    inputs: ["df"]
    depends_on: ["extract"]
    config:
      s3_endpoint: http://{{ minio.host }}:{{ minio.port }}
      s3_bucket: {{ minio.bucket }}
      s3_key: exports/{{ trino.schema }}_trino_s3.csv
      s3_access_key: {{ minio.access_key }}
      # s3_secret_key is provided via environment variable S3_SECRET_KEY
