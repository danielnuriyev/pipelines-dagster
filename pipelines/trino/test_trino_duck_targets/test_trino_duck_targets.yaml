# Assets this pipeline produces (Trino table and S3 file)
asset_keys:
  - ["{{ trino.catalog }}", "{{ trino.schema }}", "test_trino_duck_targets"]
  - ["s3", "{{ minio.bucket }}", "exports", "test_trino_duck_targets"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 4  # Allow parallel execution of load steps

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 3600          # Maximum delay (1 hour)

# Pipeline steps - extract from Trino, pass through DuckDB, load to both Trino and S3
steps:
  # Step 1: Extract from Trino (no batching)
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    concurrency_key: "trino_reads"  # Limit concurrent Trino reads
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.test_a
      batch_size: 50
      pk: id
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1.0   # Wait 1s, 2s, 4s
        max_delay: 60.0   # Cap delay at 60 seconds

  # Step 2: Pass through DuckDB (no transformation)
  - name: duckdb_passthrough
    executor: duckdb_sql
    inputs: ["df"]
    outputs: ["processed_df"]
    depends_on: ["extract"]  # Depends on extract step
    concurrency_key: "data_processing"  # Limit concurrent data processing
    config:
      sql_query: "SELECT * FROM input_df"  # Simple passthrough query

  # Step 3: Load data into Trino table (depends on DuckDB)
  - name: load_trino
    executor: trino_load
    inputs: ["processed_df"]
    outputs: ["trino_result"]
    depends_on: ["duckdb_passthrough"]  # Depends on duckdb step
    concurrency_key: "trino_writes"  # Limit concurrent Trino writes
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      target_catalog: {{ trino.catalog }}
      target_schema: {{ trino.schema }}
      target_table: test_trino_duck_targets
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1.0   # Wait 1s, 2s, 4s
        max_delay: 60.0   # Cap delay at 60 seconds

  # Step 4: Load data to S3 (parallel to Trino load)
  - name: load_s3
    executor: dataframe_to_s3
    inputs: ["processed_df"]
    outputs: ["s3_result"]
    depends_on: ["duckdb_passthrough"]  # Also depends on duckdb step, parallel to load_trino
    concurrency_key: "s3_writes"  # Limit concurrent S3 writes
    config:
      s3_endpoint: http://{{ minio.host }}:{{ minio.port }}
      s3_bucket: {{ minio.bucket }}
      s3_key: exports/{{ trino.schema }}_trino_duck_targets.csv
      s3_access_key: {{ minio.access_key }}
      # s3_secret_key is provided via environment variable S3_SECRET_KEY
