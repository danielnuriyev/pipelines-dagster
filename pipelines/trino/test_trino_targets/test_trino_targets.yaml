# Assets this pipeline produces (Trino table and S3 file)
asset_keys:
  - ["{{ trino.catalog }}", "{{ trino.schema }}", "test_trino_targets"]
  - ["s3", "{{ minio.bucket }}", "exports", "test_trino_targets"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 4  # Allow parallel execution of load steps

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 1h            # Maximum delay (1 hour)

# Pipeline steps - extract from Trino, load to both Trino and S3
steps:
  # Step 1: Extract from Trino (no batching)
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    concurrency_key: "trino_extract"  # Limit concurrent Trino extract operations
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.test_source
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1s    # Wait 1s, 2s, 4s
        max_delay: 1m     # Cap delay at 1 minute

  # Step 2: Load data into Trino table
  - name: load_trino
    executor: trino_load
    inputs: ["df"]
    outputs: ["trino_result"]
    depends_on: ["extract"]  # Depends on extract step
    concurrency_key: "trino_load"  # Limit concurrent Trino load operations
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      catalog: {{ trino.catalog }}
      schema: {{ trino.schema }}
      table: test_trino_targets
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1s    # Wait 1s, 2s, 4s
        max_delay: 1m     # Cap delay at 1 minute

  # Step 3: Load data to S3 (parallel to Trino load)
  - name: load_s3
    executor: dataframe_to_s3
    inputs: ["df"]
    outputs: ["s3_result"]
    depends_on: ["extract"]  # Depends on extract step, parallel to load_trino
    concurrency_key: "dataframe_to_s3"  # Limit concurrent S3 upload operations
    config:
      endpoint: http://{{ minio.host }}:{{ minio.port }}
      bucket: {{ minio.bucket }}
      key: exports/{{ trino.schema }}_trino_targets.csv
      access_key: {{ minio.access_key }}
      # s3_secret_key is provided via environment variable S3_SECRET_KEY
