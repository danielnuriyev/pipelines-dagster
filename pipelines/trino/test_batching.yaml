# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_d"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 3

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 3600          # Maximum delay (1 hour)

# Pipeline steps - three-step ETL with dependencies
steps:
  # Step 1: Extract from Trino in batches of 10
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    concurrency_key: "trino_reads"  # Limit concurrent Trino reads
    config:
      host: trino-6f3317f2-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT * FROM lakehouse.test.test_a
      batch_size: 10  # Single level batching: 100 rows -> 10 batches of 10
      pk: id
      retry:  # Custom retry configuration
        max_attempts: 5  # Try up to 5 times instead of default 3
        base_delay: 3.0   # Wait 3s, 6s, 12s, 24s, 48s
        max_delay: 60.0   # Cap delay at 60 seconds

  # Step 2: Load each batch into test_d
  - name: load
    executor: trino_load
    inputs: ["df"]
    depends_on: ["extract"]  # Explicit dependency on extract step
    concurrency_key: "trino_writes"  # Limit concurrent Trino writes
    config:
      host: trino-6f3317f2-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      target_catalog: lakehouse
      target_schema: test
      target_table: test_d
      recreate_table: true  # Only recreates on very first batch

  # Step 3: Validate data quality (depends on load completion)
  - name: validate
    executor: trino_extract
    depends_on: ["load"]  # Must wait for load to complete
    config:
      host: trino-6f3317f2-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT COUNT(*) as row_count FROM lakehouse.test.test_d
