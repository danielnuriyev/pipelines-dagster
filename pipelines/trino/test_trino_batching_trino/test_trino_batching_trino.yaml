# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_d"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 1

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 3600          # Maximum delay (1 hour)

# Pipeline steps - three-step ETL with dependencies
steps:
  # Step 1: Extract from Trino in batches
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    concurrency_key: "trino_reads"  # Limit concurrent Trino reads
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT * FROM lakehouse.test.test_a
      batch_size: 50
      pk: id
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 5 times instead of default 3
        base_delay: 1.0   # Wait 3s, 6s, 12s, 24s, 48s
        max_delay: 60.0   # Cap delay at 60 seconds

  # Step 2: Transform data using DuckDB SQL
  - name: transform
    executor: duckdb_sql
    inputs: ["df"]
    outputs: ["transformed_df"]
    depends_on: ["extract"]  # Depends on extract step
    concurrency_key: "data_processing"  # Limit concurrent data processing
    config:
      sql_file: transform_data.sql  # Load SQL from same directory

  # Step 3: Load transformed data into test_d
  - name: load
    executor: trino_load
    inputs: ["transformed_df"]
    depends_on: ["transform"]  # Depends on transform step
    concurrency_key: "trino_writes"  # Limit concurrent Trino writes
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      target_catalog: lakehouse
      target_schema: test
      target_table: test_d
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 5 times instead of default 3
        base_delay: 1.0   # Wait 3s, 6s, 12s, 24s, 48s
        max_delay: 60.0   # Cap delay at 60 seconds
