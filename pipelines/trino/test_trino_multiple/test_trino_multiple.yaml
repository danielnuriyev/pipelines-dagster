# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_trino_multiple"]

# Dependencies (asset keys this depends on) - test_a is external/source data
# depends_on: []

# Schedule (cron expression) - runs every minute
# schedule: "* * * * *"

# Pipeline steps
steps:
  # Step 1: Extract from test_a and load into temp_test
  - name: extract_to_temp
    executor: trino_insert_select
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT * FROM lakehouse.test.test_a
      target_catalog: lakehouse
      target_schema: test
      target_table: temp_test

  # Step 2: Transform from temp_test and load into final table
  - name: load_final
    executor: trino_insert_select
    depends_on: ["extract_to_temp"]
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT * FROM lakehouse.test.temp_test
      target_catalog: lakehouse
      target_schema: test
      target_table: test_trino_multiple

  # Step 3: Clean up temporary table
  - name: cleanup_temp
    executor: trino_extract
    depends_on: ["load_final"]
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: DROP TABLE lakehouse.test.temp_test
