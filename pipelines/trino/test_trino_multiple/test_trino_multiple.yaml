# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_trino_multiple"]

# Dependencies (asset keys this depends on) - test_source is external/source data
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 1

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 1h            # Maximum delay (1 hour)

# Schedule (cron expression) - runs every minute
# schedule: "* * * * *"

# Pipeline steps
steps:
  # Step 1: Extract from test_source and load into temp_test
  - name: extract_to_temp
    executor: trino_insert_select
    concurrency_key: "trino_insert_select"
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.test_source
      catalog: {{ trino.catalog }}
      schema: {{ trino.schema }}
      table: temp_test
      temp: true

  # Step 2: Transform from temp_test and load into final table
  - name: load_final
    executor: trino_insert_select
    depends_on: ["extract_to_temp"]
    concurrency_key: "trino_insert_select"
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.temp_test
      catalog: {{ trino.catalog }}
      schema: {{ trino.schema }}
      table: test_trino_multiple
