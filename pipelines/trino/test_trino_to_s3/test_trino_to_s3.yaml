# Asset this pipeline produces (no dots allowed in keys)
asset_key: ["s3", "warehouse", "exports", "trino_export_csv"]

# Dependencies (asset keys this depends on)
depends_on:
  - ["lakehouse", "test", "test_b"]

# Pipeline steps
steps:
  - name: export
    executor: trino_to_s3
    config:
      host: trino-0a966bea-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: "SELECT * FROM lakehouse.test.test_a"
      s3_endpoint: http://minio-498506da.trino.svc.cluster.local:9000
      s3_bucket: warehouse
      s3_key: exports/trino_export.csv
      s3_access_key: admin
      # s3_secret_key is provided via environment variable S3_SECRET_KEY
