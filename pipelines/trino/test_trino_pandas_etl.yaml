# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_c"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Pipeline steps - two-step ETL: extract then load
steps:
  - name: extract
    executor: trino_extract
    outputs: ["df"]  # This step produces a DataFrame
    config:
      host: trino-6f3317f2-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      select_query: SELECT * FROM lakehouse.test.test_a

  - name: load
    executor: trino_load
    inputs: ["df"]  # This step consumes the DataFrame from extract
    config:
      host: trino-6f3317f2-trino.trino.svc.cluster.local
      port: 8080
      user: dagster
      target_catalog: lakehouse
      target_schema: test
      target_table: test_c
      recreate_table: true  # Drop and recreate table on each run
