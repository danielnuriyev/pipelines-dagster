# Asset this pipeline produces
asset_key: ["lakehouse", "test", "test_trino_duck_trino"]

# Dependencies (asset keys this depends on)
# depends_on: []

# Job-level concurrency (max concurrent ops in this job)
job_concurrency: 1

# Job retry configuration
job_retry:
  max_attempts: 3          # Maximum retry attempts
  max_delay: 1h            # Maximum delay (1 hour)

# Pipeline steps - extract from Trino, pass through DuckDB, load to Trino
steps:
  # Step 1: Extract from Trino (no batching)
  - name: extract
    executor: trino_extract
    outputs: ["df"]
    concurrency_key: "trino_extract"  # Limit concurrent Trino extract operations
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      select_query: SELECT * FROM {{ trino.catalog }}.{{ trino.schema }}.test_source
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1s    # Wait 1s, 2s, 4s
        max_delay: 1m     # Cap delay at 1 minute

  # Step 2: Pass through DuckDB (no transformation)
  - name: duckdb_passthrough
    executor: duckdb_sql
    inputs: ["df"]
    outputs: ["processed_df"]
    depends_on: ["extract"]  # Depends on extract step
    concurrency_key: "duckdb_sql"  # Limit concurrent DuckDB operations
    config:
      sql_query: "SELECT * FROM input_df"  # Simple passthrough query

  # Step 3: Load data into {{ trino.schema }}_e
  - name: load
    executor: trino_load
    inputs: ["processed_df"]
    depends_on: ["duckdb_passthrough"]  # Depends on duckdb step
    concurrency_key: "trino_load"  # Limit concurrent Trino load operations
    config:
      host: {{ trino.host }}
      port: {{ trino.port }}
      user: {{ trino.user }}
      catalog: {{ trino.catalog }}
      schema: {{ trino.schema }}
      table: test_trino_duck_trino
      retry:  # Custom retry configuration
        max_attempts: 3  # Try up to 3 times
        base_delay: 1s    # Wait 1s, 2s, 4s
        max_delay: 1m     # Cap delay at 1 minute
