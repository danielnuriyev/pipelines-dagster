# Trino to S3 pipeline configuration
# Runs a SELECT query and exports results to S3 as CSV

# Trino connection
host: trino-6f3317f2-trino.trino.svc.cluster.local
port: 8080
user: dagster

# Query to execute
select_query: "SELECT * FROM lakehouse.test.test_a"

# S3/MinIO settings
s3_endpoint: http://minio-498506da.trino.svc.cluster.local:9000
s3_bucket: warehouse
s3_key: exports/trino_export.csv
s3_access_key: admin
# s3_secret_key should be provided via environment variable S3_SECRET_KEY

